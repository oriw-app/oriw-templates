name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: Scan all commits
        run: ./gitleaks git . --no-banner --redact -v

  templates:
    name: Validate templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install jsonschema==4.23.0
      - name: Check every template.json against the schema
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator
          schema = json.load(open("template.schema.json"))
          v = Draft202012Validator(schema)
          bad = 0
          for p in sorted(pathlib.Path("templates").glob("*/template.json")):
              for e in v.iter_errors(json.load(open(p))):
                  print(f"{p}: {e.message}"); bad += 1
          sys.exit(1 if bad else 0)
          PY
